<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>室乙第二站電路實驗室</title>
<style>
:root{
  /* 深色（提亮版·預設） */
  --bg:#1b2230; --bg2:#222c3b; --panel:#212a39; --panel2:#283344;
  --line:#3c4a60; --line2:#4d5e77;
  --txt:#e4ecf6; --mut:#9fb0c6; --dim:#7b8ca3;
  --wire:#5d6d85; --hot:#ff5241; --volt:#f5ae3f;
  --railc:#8496ad; --symc:#a9b9cf; --lblc:#cbd8e8; --lblhot:#ffd9d4;
  --coilf:#1b2432; --coilon:#4a1c16; --rnc:#6f8199;
  --sf:#1e2836; --sf2:#27313f; --sfh:#2f3a4b; --trk:#333d4e; --div:#38445a;
  --btn1:#2e3a4d; --btn2:#222c3b; --btnsh:#141a24;
  --dvon:#42201a; --dvonb:#8a3529; --dvonn:#ff9083; --dvons:#d09a92;
  --acc:#ffb020; --accTx:#20160a; --capTx:#f5f8fc;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace;
  --sans:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}
:root[data-theme="light"]{
  --bg:#e9eef5; --bg2:#f4f7fb; --panel:#ffffff; --panel2:#f1f5fa;
  --line:#ccd6e3; --line2:#adbbcb;
  --txt:#1e2836; --mut:#4f5e70; --dim:#667586;
  --wire:#93a2b6; --hot:#d63619; --volt:#a86c06;
  --railc:#74829a; --symc:#54627a; --lblc:#2b3644; --lblhot:#9d2712;
  --coilf:#ffffff; --coilon:#ffdfd8; --rnc:#8593a5;
  --sf:#ffffff; --sf2:#f1f5fa; --sfh:#e5ecf5; --trk:#dce3ed; --div:#dbe2ec;
  --btn1:#ffffff; --btn2:#e9eef5; --btnsh:#c0cad8;
  --dvon:#fde4de; --dvonb:#e5a094; --dvonn:#b32d17; --dvons:#8a564c;
  --acc:#a86800; --accTx:#fff6e6; --capTx:#f5f8fc;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;line-height:1.5}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:.01em}

/* ---------- shell ---------- */
.app{max-width:1560px;margin:0 auto;padding:0 14px 60px}
header.top{padding:18px 2px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:19px}
.brand .sub{font-size:12.5px;color:var(--mut)}
.brand .sp{flex:1}
button.tgl{background:var(--btn1);color:var(--txt);border:1px solid var(--line2);
  border-radius:8px;padding:6px 12px;font-size:12.5px;font-family:var(--sans);cursor:pointer;
  transition:.14s;align-self:center}
button.tgl:hover{border-color:var(--acc);color:var(--acc)}
nav#tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
nav#tabs button{
  background:var(--panel);color:var(--mut);border:1px solid var(--line);
  border-radius:8px;padding:7px 12px;font-size:13px;font-family:var(--sans);
  cursor:pointer;transition:.14s;white-space:nowrap}
nav#tabs button:hover{border-color:var(--line2);color:var(--txt)}
nav#tabs button.on{background:var(--acc);border-color:var(--acc);color:var(--accTx);font-weight:650}

main{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px;margin-top:14px;align-items:start}
@media(max-width:1180px){main{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card>.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 13px;background:var(--panel2);border-bottom:1px solid var(--line)}
.card>.hd h3{font-size:12.5px;color:var(--mut);letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.card>.bd{padding:13px}

/* ---------- ladder stage ---------- */
#stage .bd{padding:6px 8px 10px;overflow:auto;max-height:min(780px,80vh);
  background:radial-gradient(circle at 18% 0%,var(--bg2) 0%,var(--panel) 62%);
  scrollbar-color:var(--line2) transparent}
#diagram svg{display:block;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut)}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:5px;vertical-align:2px}

/* svg classes */
.w{stroke:var(--wire);stroke-width:2.1;fill:none;stroke-linecap:round}
.w.hot{stroke:var(--hot);stroke-width:3.1;filter:drop-shadow(0 0 4px rgba(255,68,54,.55))}
.w.volt{stroke:var(--volt);stroke-width:2.4;opacity:.9}
.rail{stroke:var(--railc);stroke-width:3;fill:none}
.rail.hot{stroke:var(--hot);filter:drop-shadow(0 0 5px rgba(255,68,54,.45))}
.sym{stroke:var(--symc);stroke-width:2.4;fill:none;stroke-linecap:round}
.sym.hot{stroke:var(--hot)}
.sym.volt{stroke:var(--volt)}
.tsym{fill:none;stroke:var(--symc);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.tsym.hot{stroke:var(--hot)}
.tagbg{fill:#ffb020}
.brg{stroke:var(--hot);stroke-width:2.6;fill:none;opacity:0}
.brg.on{opacity:1;filter:drop-shadow(0 0 4px rgba(255,68,54,.6))}
.lbl{font-family:var(--mono);font-size:11.5px;fill:var(--lblc);text-anchor:middle;font-weight:600}
.lbl.hot{fill:var(--lblhot)}
.sub{font-family:var(--sans);font-size:9.5px;fill:var(--dim);text-anchor:middle}
.tag{font-family:var(--sans);font-size:9.5px;fill:#20160a;text-anchor:middle;font-weight:700}
.coilbg{fill:var(--coilf);stroke:var(--symc);stroke-width:2.4}
.coilbg.on{fill:var(--coilon);stroke:var(--hot);filter:drop-shadow(0 0 6px rgba(255,68,54,.5))}
.rn{font-family:var(--mono);font-size:10px;fill:var(--rnc);text-anchor:end}
.bar{stroke:var(--symc);stroke-width:4.2;fill:none;stroke-linecap:butt}
.bar.hot{stroke:var(--hot)}
.term{fill:var(--coilf);stroke:var(--symc);stroke-width:1.8}
.jd{fill:var(--railc)}
.fuse{fill:var(--coilf);stroke:var(--symc);stroke-width:1.8}
.wrap2{display:flex;align-items:flex-start;gap:22px}
.pwrbox{flex:0 0 auto;border-right:1px dashed var(--line2);padding-right:20px}
.pwrbox svg{display:block;height:auto}
.pwrbox .cap,.ctlcap{font-size:11px;color:var(--dim);letter-spacing:.06em;margin:0 0 6px}
.seg.vsel{width:auto;flex:0 0 auto}
.seg.vsel button{padding:5px 11px;font-size:11.5px}

/* ---------- 圖面縮放 ---------- */
.zoom{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.zoom button{width:30px;height:28px;border-radius:7px;border:1px solid var(--line2);
  background:var(--btn2);color:var(--txt);font-size:15px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0}
.zoom button:hover{border-color:var(--acc);color:var(--acc)}
.zoom button.fit{width:auto;padding:0 9px;font-size:11.5px}
.zoom .pct{font-family:var(--mono);font-size:11px;color:var(--dim);min-width:38px;text-align:center}

/* ---------- 響應式 ---------- */
@media(max-width:760px){
  .app{padding:0 8px 40px}
  header.top{padding:12px 0 8px}
  .brand h1{font-size:16px;line-height:1.3}
  .brand .sub{display:none}
  nav#tabs{gap:5px;margin-top:9px;flex-wrap:nowrap;overflow-x:auto;
    scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;padding-bottom:4px}
  nav#tabs::-webkit-scrollbar{height:3px}
  nav#tabs button{flex:0 0 auto;scroll-snap-align:start;padding:8px 11px;font-size:12.5px}
  main{gap:10px;margin-top:10px}
  .card>.hd{flex-wrap:wrap;padding:8px 10px;gap:7px}
  .card>.hd h3{font-size:11.5px;flex:1 1 100%}
  .card>.bd{padding:10px}
  .legend{font-size:10.5px;gap:9px;flex:1 1 100%}
  #stage .bd{max-height:62vh;padding:4px}
  .guide .bd{gap:10px}
  ol.steps{max-height:150px}
  .narr{font-size:13.5px}
  button.pb{min-width:0;flex:1 1 calc(50% - 4px);padding:11px 8px}
  .gbtns button{padding:11px 4px}
  .lmp{width:46px}
  .devs{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
  .pwrbox{padding:0 0 12px}
}
/* ---------- 全螢幕檢視 ---------- */
#stage.fs{position:fixed;inset:0;z-index:80;margin:0;border-radius:0;border:0;
  display:flex;flex-direction:column;background:var(--panel)}
#stage.fs>.bd{flex:1 1 auto;max-height:none;height:auto;padding:0;
  touch-action:none;overscroll-behavior:contain}
#stage.fs .wrap2{gap:0}
#stage.fs #diagram{transform-origin:0 0}
#stage.fs .pwrbox,#stage.fs .vsel,#stage.fs .legend{display:none}
#stage.fs .fsonly{display:inline-flex}
body.fslock{overflow:hidden}
.fsonly{display:none}
#stage.fs .hd{position:sticky;top:0;z-index:2}
.fshint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:81;
  background:var(--panel2);border:1px solid var(--line2);border-radius:20px;
  padding:7px 15px;font-size:12px;color:var(--mut);pointer-events:none;
  opacity:0;transition:opacity .3s}
.fshint.show{opacity:1}
@media(max-width:400px){
  button.pb{flex:1 1 100%}
  .seg button{padding:9px 3px;font-size:11px}
}
@media(display-mode:standalone){
  body{overscroll-behavior-y:contain}
}
@media(max-width:900px){.wrap2{flex-direction:column}
  .pwrbox{border-right:0;border-bottom:1px dashed var(--line2);padding:0 0 14px}}
.act{fill:var(--symc)}
.arw{fill:var(--railc)}
.lblL{font-family:var(--mono);font-size:11.5px;fill:var(--lblc);text-anchor:start;font-weight:600}
.lblL.hot{fill:var(--lblhot)}
.cin{font-family:var(--mono);font-size:10.5px;fill:var(--lblc);text-anchor:middle;font-weight:700}
.cin.on{fill:var(--lblhot)}
.brg{stroke-width:4.2}


/* ---------- side panel ---------- */
aside{display:flex;flex-direction:column;gap:12px}
#scene svg{display:block;width:100%;height:auto}

.ctl{display:flex;flex-direction:column;gap:11px}
.ctl .grp{display:flex;flex-direction:column;gap:6px}
.ctl .gl{font-size:10.5px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.btnrow{display:flex;gap:7px;flex-wrap:wrap}
button.pb{
  position:relative;min-width:64px;padding:9px 12px;border-radius:9px;cursor:pointer;
  border:1px solid var(--line2);background:linear-gradient(var(--btn1),var(--btn2));color:var(--txt);
  font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.03em;
  transition:transform .06s,box-shadow .12s;box-shadow:0 3px 0 var(--btnsh), 0 4px 8px rgba(0,0,0,.18);
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
button.pb small{display:block;font-family:var(--sans);font-size:9.5px;font-weight:500;color:var(--mut);letter-spacing:0}
button.pb:active,button.pb.down{transform:translateY(3px);box-shadow:0 0 0 var(--btnsh),0 1px 4px rgba(0,0,0,.22)}
button.pb.grn,button.pb.red,button.pb.ylw,button.pb.on{color:var(--capTx)}
button.pb.grn small,button.pb.red small,button.pb.ylw small,button.pb.on small{color:rgba(245,248,252,.72)}
button.pb.grn{border-color:#1f6b41;background:linear-gradient(#25714a,#164a2d)}
button.pb.red{border-color:#8a2b22;background:linear-gradient(#8c352a,#5a1f18)}
button.pb.ylw{border-color:#8a7020;background:linear-gradient(#8a7622,#544615)}
button.pb.down.grn,button.pb.grn:active{background:linear-gradient(#34a065,#25714a)}
button.pb.down.red,button.pb.red:active{background:linear-gradient(#b0402f,#8c352a)}
button.pb.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 0 12px rgba(255,176,32,.28);
  background:linear-gradient(#6b4e15,#42300b)}

.seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{flex:1;padding:8px 6px;background:var(--btn2);border:0;border-right:1px solid var(--line2);
  color:var(--mut);font-family:var(--sans);font-size:12px;cursor:pointer;transition:.12s}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc);color:var(--accTx);font-weight:700}

.slider{display:flex;align-items:center;gap:9px}
.slider input{flex:1;accent-color:var(--acc)}
.slider span{font-family:var(--mono);font-size:11.5px;color:var(--mut);min-width:42px;text-align:right}

/* lamps + status */
.lamps{display:flex;gap:9px;flex-wrap:wrap}
.lmp{display:flex;flex-direction:column;align-items:center;gap:4px;width:52px}
.lmp .bulb{width:28px;height:28px;border-radius:50%;background:var(--sf);
  border:2px solid var(--line2);transition:.18s}
.lmp .nm{font-family:var(--mono);font-size:10px;color:var(--dim);font-weight:700}
.lmp .cn{font-size:9px;color:var(--dim);text-align:center;line-height:1.25}
.lmp.on .nm{color:var(--txt)}

.devs{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.dv{background:var(--sf);border:1px solid var(--line);border-radius:7px;padding:5px 7px}
.dv .n{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--mut)}
.dv .s{font-size:9.5px;color:var(--dim)}
.dv.on{background:var(--dvon);border-color:var(--dvonb)}
.dv.on .n{color:var(--dvonn)}
.dv.on .s{color:var(--dvons)}
.bar{height:3px;background:var(--trk);border-radius:2px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);width:0}

/* ---------- guide ---------- */
.guide{margin-top:14px}
.guide .bd{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px}
@media(max-width:820px){.guide .bd{grid-template-columns:1fr}}
select.sc{width:100%;background:var(--sf);color:var(--txt);border:1px solid var(--line2);
  border-radius:8px;padding:8px 9px;font-family:var(--sans);font-size:13px}
.gbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.gbtns button{flex:1;min-width:62px;padding:8px 4px;border-radius:8px;border:1px solid var(--line2);
  background:var(--btn2);color:var(--txt);font-size:12.5px;cursor:pointer;transition:.12s}
.gbtns button:hover{border-color:var(--acc);color:var(--acc)}
.gbtns button.play{background:var(--acc);border-color:var(--acc);color:var(--accTx);font-weight:700}
.narr{background:var(--sf2);border:1px solid var(--line);
  border-radius:8px;padding:11px 13px;font-size:14px;min-height:52px}
.narr b{color:var(--acc)}
ol.steps{list-style:none;margin:9px 0 0;padding:0;display:flex;flex-direction:column;gap:3px;
  max-height:190px;overflow-y:auto}
ol.steps li{font-size:12.3px;color:var(--dim);padding:4px 9px;border-radius:6px;cursor:pointer;
  border-left:2px solid transparent}
ol.steps li:hover{background:var(--sf2);color:var(--mut)}
ol.steps li.on{background:var(--sfh);color:var(--txt);border-left-color:var(--acc)}
ol.steps li.done{color:var(--mut)}
.hint{font-size:12px;color:var(--dim);margin-top:7px}
.note{font-size:12.5px;color:var(--mut);margin:0 0 10px;line-height:1.65}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px dashed var(--div)}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--mono);color:var(--txt);font-weight:600}
.kv span{color:var(--mut)}

/* 無障礙 */
:where(button,select,input):focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.dv,.lmp .bulb,#scene text,.narr{font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>
</head>
<body>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1b2230">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="室乙第二站">
<link rel="apple-touch-icon" href="icon-192.png">

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>室內配線乙級 · 第二站 互動電路實驗室</h1>
      <span class="sub">CNS 控制電路圖 · 即時通電追蹤 · 動作分解導引</span>
      <span class="sp"></span>
      <button class="tgl" id="theme" type="button">◐ 淺色</button>
    </div>
    <nav id="tabs"></nav>
  </header>

  <main>
    <section class="card" id="stage">
      <div class="hd">
        <h3 id="ctitle">—</h3>
        <div class="zoom" id="zoom">
          <button type="button" data-z="-" aria-label="縮小">−</button>
          <span class="pct" id="zpct">100%</span>
          <button type="button" data-z="+" aria-label="放大">＋</button>
          <button type="button" data-z="fit" class="fit">適合寬度</button>
          <button type="button" data-z="fs" class="fit" id="bFs">⛶ 全螢幕</button>
        </div>
        <div class="seg vsel" id="vsel">
          <button data-v="all">全圖</button><button data-v="pwr">主電路</button><button data-v="ctl">控制電路</button>
        </div>
        <div class="legend">
          <span><i style="background:var(--hot)"></i>電流通過</span>
          <span><i style="background:var(--volt)"></i>有電壓·無迴路</span>
          <span><i style="background:var(--wire)"></i>無電</span>
        </div>
      </div>
      <div class="bd">
        <div class="wrap2">
          <div id="power" class="pwrbox"></div>
          <div id="diagram"></div>
        </div>
      </div>
    </section>

    <aside>
      <div class="card" id="cScene"><div class="hd"><h3>現場設備狀態</h3></div><div class="bd" id="scene"></div></div>
      <div class="card"><div class="hd"><h3>操作盤</h3><span class="sub" style="font-size:11px;color:var(--dim)">按鈕＝按住有效</span></div><div class="bd"><div class="ctl" id="controls"></div></div></div>
      <div class="card" id="cLamps"><div class="hd"><h3>指示燈</h3></div><div class="bd"><div class="lamps" id="lamps"></div></div></div>
      <div class="card" id="cDevs"><div class="hd"><h3>元件動作狀態</h3></div><div class="bd"><div class="devs" id="devs"></div></div></div>
    </aside>
  </main>

  <section class="card guide">
    <div class="hd"><h3>動作分解導引</h3><span class="sub" id="gstat" style="font-size:11px;color:var(--dim)"></span></div>
    <div class="bd">
      <div>
        <select class="sc" id="scen"></select>
        <div class="gbtns">
          <button id="bPrev">← 上一步</button>
          <button id="bNext">下一步 →</button>
        </div>
        <div class="gbtns">
          <button id="bPlay" class="play">▶ 自動播放</button>
          <button id="bReset">⟲ 重置電路</button>
        </div>
        <div class="hint">點擊右側步驟可直接跳到該階段；也可以完全自由地用「操作盤」自行操作。</div>
      </div>
      <div>
        <div class="narr" id="narr">選擇一個操作情境，或直接按下操作盤上的按鈕自行實驗。</div>
        <ol class="steps" id="steplist"></ol>
      </div>
    </div>
  </section>
</div>

<script>
"use strict";

/* ---------- 主題色盤（場景 SVG 用；階梯圖走 CSS 變數） ---------- */
const PAL={
  dark:{
    bg:'#1b2230', sf:'#1e2836', sf2:'#27313f', trk:'#333d4e', div:'#38445a',
    ln:'#3f4d63', wr:'#4b5a72', mt:'#5a6a80', mt2:'#69798f', bus:'#e3eaf2',
    tx:'#cbd8e8', mu:'#9fb0c6', dm:'#7b8ca3', symc:'#a9b9cf',
    lblhot:'#ffd9d4', coilon:'#4a1c16',
    okbg:'#17512f', okfg:'#37d67a', hotbg:'#6b2a1f', hotfg:'#ff9083',
    water:'#1c6fa8', water2:'#14506e', wtop:'#5ec8ff', sew:'#4a6b2f',
    ramOn:'#7c4a12', ptR:'#ff5f4d', onTx:'#20160a', wht:'#f2f6fb',
    red:'#ff5544', org:'#ff8c1a', ylw:'#ffd23f', blu:'#4aa8ff', amb:'#ffb020'
  },
  light:{
    bg:'#e9eef5', sf:'#ffffff', sf2:'#f1f5fa', trk:'#dce3ed', div:'#dbe2ec',

/* =======================================================================
   1. 階梯圖元件簡寫
   ======================================================================= */
const no  =(d,h)=>({t:'no',d,h});      // a 接點（常開）
const nc  =(d,h)=>({t:'nc',d,h});      // b 接點（常閉）
const tno =(d,h)=>({t:'tno',d,h});     // 限時 a 接點
const tnc =(d,h)=>({t:'tnc',d,h});     // 限時 b 接點
const pno =(d,h)=>({t:'pno',d,h});     // 按鈕 a 接點
const pnc =(d,h)=>({t:'pnc',d,h});     // 按鈕 b 接點
const coil=(d,a)=>({t:'coil',d,a});    // 線圈 (a: 'S'/'R'/'C' 特殊功能)
const lamp=(d,c)=>({t:'lamp',d,c});    // 指示燈
const bz  =(d)=>({t:'bz',d});          // 蜂鳴器
const par =(...b)=>({t:'par',b});      // 並聯

/* =======================================================================
   2. 模擬核心
   ======================================================================= */
class Sim{
  constructor(cfg){ this.cfg=cfg; this.taps=[]; this.reset(); }

  reset(){
    this.st={}; this.m={};
    for(const [k,v] of Object.entries(this.cfg.devices)){
      this.st[k]={k, kind:v.k, n:v.n||k, T:v.T||3, preset:v.preset||5,
                  on:false, done:false, held:false, t:0, c:false, pc:false, cnt:0};
    }
    this.taps=[];
    if(this.cfg.init) this.cfg.init(this);
    for(let i=0;i<4;i++) this.tick(0);
  }
  d(n){ return this.st[n] || (this.st[n]={k:n,kind:'flag',n,on:false,done:false,held:false,t:0,c:false,pc:false,cnt:0}); }
  set(n,v){ this.d(n).on=!!v; }
  get(n){ return this.d(n).on; }
  tap(n,dur){ this.set(n,true); this.taps.push({n,t:dur||0.35}); }
  mset(k,v){ this.m[k]=v; }

  /* ---- 單一元件是否導通 ---- */
  conduct(el){
    const d=this.d(el.d);
    switch(el.t){
      case 'no': case 'pno': return d.on;
      case 'nc': case 'pnc': return !d.on;
      case 'tno': return d.kind==='toff' ? d.held : d.done;
      case 'tnc': return !(d.kind==='toff' ? d.held : d.done);
    }
    return true;
  }
  isOut(el){ return el.t==='coil'||el.t==='lamp'||el.t==='bz'; }

  /* ---- 正向：電壓傳遞 ---- */
  fwd(seq,pin,out){
    let p=pin;
    for(const el of seq){
      el._vin=p;
      if(el.t==='par'){
        let o=false;
        for(const br of el.b){ if(this.fwd(br,p,out)) o=true; }
        p=o;
      }else if(this.isOut(el)){
        el._on=p;
        const key=el.d+'|'+(el.a||'');
        out[key]=(out[key]||false)||p;
        p=true;
      }else{
        el._c=this.conduct(el);
        p=p&&el._c;
      }
    }
    return p;
  }
  /* ---- 反向：是否真的形成迴路（有電流） ---- */
  back(seq,downOK){
    let ok=downOK;
    for(let i=seq.length-1;i>=0;i--){
      const el=seq[i];
      if(this.isOut(el)){ el._flow=el._vin; el._oflow=false; ok=true; }
      else if(el.t==='par'){
        let any=false;
        for(const br of el.b){ if(this.back(br,ok)) any=true; }
        el._flow=el._vin&&any; el._oflow=el._flow&&any; ok=any;
      }else{
        el._flow=el._vin&&el._c&&ok; el._oflow=el._flow; ok=el._c&&ok;
      }
    }
    return ok;
  }

  /* ---- 收斂求解 ---- */
  settle(){
    for(let it=0; it<40; it++){
      const out={};
      const ms=this.cfg.master, cm=this.cfg.common;
      const mg = ms ? this.fwd(ms,true,out) : true;      // 匯流排總開關
      const cg = cm ? this.fwd(cm,mg,out) : mg;          // 底部共用回路
      for(const r of this.cfg.rungs) this.fwd(r.s, r.bypass?mg:cg, out);
      let chg=false;
      for(const [key,v] of Object.entries(out)){
        const [name,act]=key.split('|');
        const d=this.d(name);
        if(d.kind==='alt'){ if(d.cin!==v){d.cin=v; chg=true;} }
        else if(d.kind==='cnt'){
          if(act==='C'){ if(d.cin!==v){d.cin=v;chg=true;} }
          else if(act==='R'){ if(d.rin!==v){d.rin=v;chg=true;} }
        }
        else if(d.kind==='keep'){
          const nv = act==='S' ? (v?true:d.on) : act==='R' ? (v?false:d.on) : d.on;
          if(nv!==d.on){ d.on=nv; chg=true; }
        }
        else if(d.on!==v){ d.on=v; chg=true; }
      }
      if(!chg) break;
    }
    for(const r of this.cfg.rungs) this.back(r.s,false);
    if(this.cfg.common){
      const any=this.cfg.rungs.some(r=>!r.bypass && r.s.length && r.s[0]._flow);
      this.back(this.cfg.common,any);
    }
    if(this.cfg.master){
      const any=this.cfg.rungs.some(r=>r.s.length && r.s[0]._flow);
      this.back(this.cfg.master,any);
    }
  }

  timers(dt){
    for(const d of Object.values(this.st)){
      if(d.kind==='ton'){
        if(d.on){ d.t=Math.min(d.T,d.t+dt); d.done=d.t>=d.T; }
        else { d.t=0; d.done=false; }
      }else if(d.kind==='toff'){
        if(d.on){ d.t=0; d.held=true; }
        else if(d.held){ d.t+=dt; if(d.t>=d.T){ d.held=false; d.t=0; } }
      }
    }
  }
  edges(){
    let chg=false;
    for(const d of Object.values(this.st)){
      if(d.kind==='alt'){
        if(d.cin && !d.pc){ d.on=!d.on; chg=true; }
        d.pc=!!d.cin;
      }else if(d.kind==='cnt'){
        if(d.rin){ if(d.cnt!==0){d.cnt=0;chg=true;} }
        else if(d.cin && !d.pc){ d.cnt++; chg=true; }
        d.pc=!!d.cin;
        const on=d.cnt>=d.preset;
        if(d.on!==on){ d.on=on; chg=true; }
      }
    }
    return chg;
  }

  tick(dt){
    for(let i=this.taps.length-1;i>=0;i--){
      const tp=this.taps[i]; tp.t-=dt;
      if(tp.t<=0){ this.set(tp.n,false); this.taps.splice(i,1); }
    }
    if(this.cfg.pre) this.cfg.pre(this,dt);
    this.settle();
    if(dt>0){ this.timers(dt); this.settle(); }
    if(this.edges()) this.settle();
    if(this.cfg.post) this.cfg.post(this,dt);
  }
}

/* =======================================================================
   3. 階梯圖繪製
   ======================================================================= */
const SER=74, PAR=112, TOPY=58, COILDROP=78;
const SVGNS='http://www.w3.org/2000/svg';
const mk=(t,a={})=>{const e=document.createElementNS(SVGNS,t);
  for(const [k,v] of Object.entries(a)) e.setAttribute(k,v); return e;};

/* 量測：w = 串聯格數（縱向），h = 並聯分支數（橫向） */
function measure(seq){
  let w=0,h=1;
  for(const el of seq){
    if(el.t==='par'){
      let mw=0,mh=0;
      for(const br of el.b){ const m=measure(br); mw=Math.max(mw,m.w); mh+=m.h; }
      el._w=mw; el._h=mh; w+=mw; h=Math.max(h,mh);
    } else { el._w=1; el._h=1; w+=1; }
  }
  return {w,h};
}

function dot(g,x,y){ g.appendChild(mk('circle',{cx:x,cy:y,r:3.4,class:'jd'})); }

/* ---------- 元件符號（CNS 縱向畫法） ---------- */
function symbol(g,el,x,y,sim){
  const A=(t,at)=>{const e=mk(t,at); g.appendChild(e); return e;};
  const SY=(t,at,base)=>{const e=A(t,Object.assign({class:base},at)); e.dataset.b=base;
    (el._sym=el._sym||[]).push(e); return e;};
  const P=[]; el._paths=P; el._sym=[];
  const T=el.t, d=sim.d(el.d), half=SER/2;

  /* 線圈 / 指示燈 / 蜂鳴器 —— 圓內書寫元件名，對齊底部同一列 */
  if(T==='coil'||T==='lamp'||T==='bz'){
    P.push(A('line',{x1:x,y1:y-half,x2:x,y2:y-18,class:'w'}));
    P.push(A('line',{x1:x,y1:y+18,x2:x,y2:y+half,class:'w'}));
    if(T==='bz'){
      el._box=A('rect',{x:x-17,y:y-16,width:34,height:32,rx:1.5,class:'coilbg'});
      SY('line',{x1:x-21,y1:y+20,x2:x+21,y2:y-20},'sym');
    } else {
      el._box=A('circle',{cx:x,cy:y,r:18,class:'coilbg'});
      if(T==='lamp'){                       /* 指示燈：⊗ */
        el._spk=[];
        for(const ang of [45,135,225,315]){
          const a=ang*Math.PI/180;
          el._spk.push(A('line',{x1:x+8.6*Math.cos(a),y1:y+8.6*Math.sin(a),
            x2:x+17.6*Math.cos(a),y2:y+17.6*Math.sin(a),class:'sym'}));
        }
      }
    }
    const nm = (d.kind==='keep'&&el.a) ? (el.a==='S'?'SC':'RC')
             : el.d+(el.a?'-'+el.a:'');
    el._nm=A('text',{x,y:y+4,class:'cin'}); el._nmb='cin';
    el._nm.textContent=nm;
    if(nm.length>3) el._nm.setAttribute('font-size','9');
    A('text',{x,y:y+36,class:'sub'}).textContent=d.n;
    return;
  }

  const isNC=(T==='nc'||T==='pnc'||T==='tnc');
  const isTHR=/^TH/i.test(el.d);
  let stub=6, lx=x+21;

  if(isTHR){                                   /* 積熱電驛（交叉剪刀狀） */
    stub=12; lx=x+17;
    A('circle',{cx:x,cy:y-12,r:3.2,class:'term'});
    A('circle',{cx:x,cy:y+12,r:3.2,class:'term'});
    SY('line',{x1:x-10,y1:y+8,x2:x+10,y2:y-8},'sym');
    SY('line',{x1:x-10,y1:y-8,x2:x+10,y2:y+8},'sym');
    el._brg=A('line',{x1:x,y1:y-12,x2:x,y2:y+12,class:'brg'});
  }
  else if(/^(FS|LS)/.test(el.d)){              /* 浮球／極限開關：機械操作塊 */
    stub=12; lx=x+21;
    A('circle',{cx:x,cy:y-12,r:3.2,class:'term'});
    A('circle',{cx:x,cy:y+12,r:3.2,class:'term'});
    if(isNC) SY('line',{x1:x,y1:y-12,x2:x,y2:y+12},'sym');
    else     SY('line',{x1:x+7,y1:y-12,x2:x+7,y2:y+12},'sym');
    A('rect',{x:x-19,y:y-7,width:6,height:14,class:'act'});
    SY('line',{x1:x-13,y1:y,x2:x-1,y2:y},'sym');
    el._brg=A('line',{x1:x,y1:y-12,x2:x,y2:y+12,class:'brg'});
  }
  else if(/^COS/.test(el.d)){                  /* 切換開關：旋轉刀形接點 */
    stub=12; lx=x+21;
    A('circle',{cx:x,cy:y-12,r:3.2,class:'term'});
    A('circle',{cx:x,cy:y+12,r:3.2,class:'term'});
    SY('line',{x1:x,y1:y+12,x2:(isNC?x:x+10),y2:y-12},'sym');
    A('path',{d:`M${x-12} ${y-5} A8 8 0 0 1 ${x-12} ${y+5}`,class:'sym'});
    el._brg=A('line',{x1:x,y1:y-12,x2:x,y2:y+12,class:'brg'});
  }
  else if(T==='pno'||T==='pnc'){               /* 按鈕：端子圈 ＋ 側邊推桿 */
    stub=12; lx=x+26;
    A('circle',{cx:x,cy:y-12,r:3.2,class:'term'});
    A('circle',{cx:x,cy:y+12,r:3.2,class:'term'});
    if(isNC) SY('line',{x1:x,y1:y-12,x2:x,y2:y+12},'sym');
    else     SY('line',{x1:x+7,y1:y-12,x2:x+7,y2:y+12},'sym');
    SY('line',{x1:x+14,y1:y-22,x2:x+14,y2:y+1},'sym');
    SY('line',{x1:x+6,y1:y-22,x2:x+22,y2:y-22},'sym');
    SY('line',{x1:x+7,y1:y+1,x2:x+14,y2:y+1},'sym');
    el._brg=A('line',{x1:x,y1:y-12,x2:x,y2:y+12,class:'brg'});
  }
  else if(T==='tno'||T==='tnc'){               /* 限時接點：端子圈 ＋ ▷ */
    stub=12; lx=x+21;
    A('circle',{cx:x,cy:y-12,r:3.2,class:'term'});
    A('circle',{cx:x,cy:y+12,r:3.2,class:'term'});
    SY('path',{d:`M${x-21} ${y-8} L${x-8} ${y} L${x-21} ${y+8} Z`},'tsym');
    SY('line',{x1:x-8,y1:y,x2:x-1,y2:y},'sym');
    if(isNC) SY('line',{x1:x,y1:y-12,x2:x,y2:y+12},'sym');
    else     SY('line',{x1:x+7,y1:y-12,x2:x+7,y2:y+12},'sym');
    el._brg=A('line',{x1:x,y1:y-12,x2:x,y2:y+12,class:'brg'});
  }
  else {                                        /* 一般接點：兩條粗橫棒 */
    el._b1=SY('line',{x1:x-16,y1:y-6,x2:x+16,y2:y-6},'bar');
    el._b2=SY('line',{x1:x-16,y1:y+6,x2:x+16,y2:y+6},'bar');
    if(isNC) el._sl=SY('line',{x1:x-19,y1:y+12,x2:x+19,y2:y-12},'sym');
    el._brg=A('line',{x1:x,y1:y-6,x2:x,y2:y+6,class:'brg'});
  }

  P.push(A('line',{x1:x,y1:y-half,x2:x,y2:y-stub,class:'w'}));
  P.push(A('line',{x1:x,y1:y+stub,x2:x,y2:y+half,class:'w'}));

  el._nm=A('text',{x:lx,y:y+4,class:'lblL'}); el._nmb='lblL';
  el._nm.textContent=el.d;
  if(el.h){
    A('rect',{x:lx-1,y:y+9,width:37,height:13,rx:6.5,class:'tagbg',opacity:.92});
    A('text',{x:lx+17.5,y:y+18.5,class:'tag'}).textContent=el.h;
  }
}

/* ---------- 匯流排上的橫向符號（總開關） ---------- */
function symbolH(g,el,x,y,sim){
  const A=(t,at)=>{const e=g.appendChild(mk(t,at)); return e;};
  const SY=(t,at,base)=>{const e=A(t,Object.assign({class:base},at)); e.dataset.b=base;
    (el._sym=el._sym||[]).push(e); return e;};
  el._paths=[]; el._sym=[];
  const isNC=(el.t==='nc'||el.t==='pnc'||el.t==='tnc');
  if(el.t==='pno'||el.t==='pnc'){
    A('circle',{cx:x-12,cy:y,r:3.2,class:'term'});
    A('circle',{cx:x+12,cy:y,r:3.2,class:'term'});
    if(isNC) SY('line',{x1:x-12,y1:y,x2:x+12,y2:y},'sym');
    else     SY('line',{x1:x-12,y1:y+7,x2:x+12,y2:y+7},'sym');
    SY('line',{x1:x-22,y1:y-14,x2:x+22,y2:y-14},'sym');
    SY('line',{x1:x,y1:y-14,x2:x,y2:y-1},'sym');
  } else {
    SY('line',{x1:x-6,y1:y-16,x2:x-6,y2:y+16},'bar');
    SY('line',{x1:x+6,y1:y-16,x2:x+6,y2:y+16},'bar');
    if(isNC) SY('line',{x1:x-12,y1:y+19,x2:x+12,y2:y-19},'sym');
  }
  el._brg=A('line',{x1:x-12,y1:y,x2:x+12,y2:y,class:'brg'});
  el._nm=A('text',{x:x+26,y:y-6,class:'lblL'}); el._nmb='lblL';
  el._nm.textContent=el.d;
}

/* ---------- 縱向佈置 ---------- */
function place(g,seq,x,y0,sim,ctx,term){
  let y=y0;
  for(let i=0;i<seq.length;i++){
    const el=seq[i];
    const last = term && i===seq.length-1;

    if(el.t==='par'){
      let ty=y, by=y+el._w*SER;
      if(last){ by=ctx.coilY+SER/2; ty=by-el._w*SER;
        if(ty<y){ ty=y; by=y+el._w*SER; }
        else if(ty>y) g.appendChild(mk('line',{x1:x,y1:y,x2:x,y2:ty,class:'w'}));
      }
      let cx=x-((el._h-1)*PAR)/2, xs=[];
      for(const br of el.b){
        const m=measure(br), bx=cx+((m.h-1)*PAR)/2;
        xs.push(bx);
        const endY=place(g,br,bx,ty,sim,ctx,last);
        if(!last && endY<by) g.appendChild(mk('line',{x1:bx,y1:endY,x2:bx,y2:by,class:'w'}));
        cx+=m.h*PAR;
      }
      const x0=Math.min(...xs), x1=Math.max(...xs);
      el._vl=mk('line',{x1:x0,y1:ty,x2:x1,y2:ty,class:'w'}); g.appendChild(el._vl);
      for(const bx of xs) if(Math.abs(bx-x)>1) dot(g,bx,ty);
      if(!last){
        el._vr=mk('line',{x1:x0,y1:by,x2:x1,y2:by,class:'w'}); g.appendChild(el._vr);
        for(const bx of xs) if(Math.abs(bx-x)>1) dot(g,bx,by);
      } else el._vr=null;
      y=by;
    } else {
      let cy=y+SER/2;
      if(last){ cy=ctx.coilY;
        if(cy-SER/2>y) g.appendChild(mk('line',{x1:x,y1:y,x2:x,y2:cy-SER/2,class:'w'})); }
      symbol(g,el,x,cy,sim);
      y=cy+SER/2;
    }
  }
  if(term) g.appendChild(mk('line',{x1:x,y1:y,x2:x,y2:ctx.bot,class:'w'}));
  return y;
}

function fuse(g,x,y,lab){
  g.appendChild(mk('rect',{x:x-19,y:y-7,width:38,height:14,class:'fuse'}));
  g.appendChild(mk('line',{x1:x-19,y1:y+7,x2:x+19,y2:y-7,class:'sym'}));
  const t=mk('text',{x,y:y-13,class:'lbl'}); t.textContent='D-F'; g.appendChild(t);
  g.appendChild(mk('line',{x1:x-19,y1:y,x2:x-38,y2:y,class:'rail'}));
  g.appendChild(mk('path',{d:`M${x-38} ${y-6} L${x-49} ${y} L${x-38} ${y+6} Z`,class:'arw'}));
  const l=mk('text',{x:x-58,y:y+4,class:'lbl'}); l.textContent=lab; g.appendChild(l);
}

function buildLadder(sim){
  const cfg=sim.cfg, host=document.getElementById('diagram');
  host.innerHTML='';
  let maxSer=1, cur=176, xs=[];
  for(const r of cfg.rungs){ r._m=measure(r.s); maxSer=Math.max(maxSer,r._m.w); }
  for(const r of cfg.rungs){ const w=Math.max(1,r._m.h)*PAR; xs.push(cur+w/2); cur+=w; }
  const coilY=TOPY+(maxSer-0.5)*SER;
  const bot=coilY+COILDROP+(cfg.common?1.7*SER:0);
  const xEx=cur+30;                         /* 盤內模組專屬區（右側保留） */
  const W=cur+46+(cfg.extraW||0), H=bot+52;
  const svg=mk('svg',{viewBox:`0 0 ${W} ${H}`,xmlns:SVGNS});
  const g=mk('g'); svg.appendChild(g);

  const cm=cfg.common, colY = cm ? coilY+0.62*SER : bot;
  cfg.rungs.forEach((r,i)=>place(g,r.s,xs[i],TOPY,sim,
    {coilY,bot:(cm&&!r.bypass)?colY:bot},true));
  if(cm){
    const cx=xs[cfg.rungs.findIndex(r=>!r.bypass)];
    const lo=Math.min(...xs.filter((x,i)=>!cfg.rungs[i].bypass));
    const hi=Math.max(...xs.filter((x,i)=>!cfg.rungs[i].bypass));
    cfg._col=mk('line',{x1:lo,y1:colY,x2:hi,y2:colY,class:'w'});
    g.appendChild(cfg._col);
    for(const x of xs) if(x>=lo&&x<=hi) dot(g,x,colY);
    place(g,cm,cx,colY,sim,{coilY:colY+0.62*SER,bot},true);
  }

  const ms=cfg.master||[];
  let mx=150;
  for(const el of ms){ symbolH(g,el,mx,TOPY,sim); mx+=78; }
  const railA=mk('line',{x1:93,y1:TOPY,x2:W-22,y2:TOPY,class:'rail hot'});
  cfg._mEnd=mx;
  const railC=mk('line',{x1:93,y1:bot,x2:W-22,y2:bot,class:'rail hot'});
  g.appendChild(railA); g.appendChild(railC);
  for(const x of xs){ dot(g,x,TOPY); dot(g,x,bot); }
  fuse(g,112,TOPY,cfg.railL||'R');
  fuse(g,112,bot,cfg.railR||'T');
  host.appendChild(svg);
  cfg._xs=xs; cfg._geo={TOPY,coilY,bot,W,H,xEx};
  if(cfg.extras){ const gx=mk('g'); gx.innerHTML=cfg.extras(sim,cfg._geo,xs); g.appendChild(gx); }
  cfg._natW=W; applyZoom();
}

function paintSeq(seq,sim){
  for(const el of seq){
    if(el.t==='par'){
      const c=el._flow?'w hot':(el._vin?'w volt':'w');
      if(el._vl) el._vl.setAttribute('class',c);
      if(el._vr) el._vr.setAttribute('class',el._flow?'w hot':'w');
      for(const br of el.b) paintSeq(br,sim);
      continue;
    }
    const flow=el._flow, volt=el._vin&&!el._flow;
    const wc=flow?'w hot':volt?'w volt':'w';
    if(el._paths) for(const p of el._paths) p.setAttribute('class',wc);
    if(el._sym){ const s=flow?' hot':''; for(const n of el._sym) n.setAttribute('class',n.dataset.b+s); }
    if(el._brg) el._brg.setAttribute('class','brg'+(el._c&&flow?' on':''));
    if(el._box){
      const d=sim.d(el.d);
      const lit = (el.t==='lamp'||el.t==='bz') ? el._on : d.on;
      el._box.setAttribute('class','coilbg'+(lit?' on':''));
      if(el.t==='lamp'&&el.c){ const cc=C[el.c]||el.c;
        el._box.style.fill = lit? cc : '';
        el._box.style.stroke = lit? cc : '';
        el._box.style.filter = lit? `drop-shadow(0 0 9px ${cc})` : 'none';
      }
      if(el._nm){ el._nm.setAttribute('class','cin'+(lit?' on':''));
        el._nm.style.fill = (lit && el.t==='lamp') ? '#20160a' : ''; }
      if(el._spk) for(const n of el._spk) n.style.stroke = (lit&&el.t==='lamp') ? '#20160a' : '';
    } else if(el._nm) el._nm.setAttribute('class',(el._nmb||'lblL')+(flow?' hot':''));
  }
}
function paintLadder(sim){
  for(const r of sim.cfg.rungs) paintSeq(r.s,sim);
  if(sim.cfg.master) paintSeq(sim.cfg.master,sim);
  if(sim.cfg.common){
    paintSeq(sim.cfg.common,sim);
    const any=sim.cfg.rungs.some(r=>!r.bypass&&r.s.length&&r.s[0]._flow);
    if(sim.cfg._col) sim.cfg._col.setAttribute('class',any?'w hot':'w');
  }
}

function buildControls(sim){
  const box=document.getElementById('controls'); box.innerHTML='';

  for(const inp of sim.cfg.inputs){ (groups[inp.g||'操作']=groups[inp.g||'操作']||[]).push(inp); }
  for(const [gn,list] of Object.entries(groups)){
    const grp=document.createElement('div'); grp.className='grp';
    const gl=document.createElement('div'); gl.className='gl'; gl.textContent=gn; grp.appendChild(gl);
    const row=document.createElement('div'); row.className='btnrow'; grp.appendChild(row);
    for(const inp of list){
      if(inp.k==='mom'){
        const b=document.createElement('button'); b.className='pb '+(inp.c||'');
        b.innerHTML=`${inp.d}<small>${inp.n}</small>`;
        const dn=e=>{e.preventDefault(); sim.set(inp.d,true); b.classList.add('down');};
        const up=()=>{ sim.set(inp.d,false); b.classList.remove('down');};
        b.addEventListener('pointerdown',dn); b.addEventListener('pointerup',up);
        b.addEventListener('pointerleave',up); b.addEventListener('pointercancel',up);
        row.appendChild(b); inp._el=b;
      }else if(inp.k==='tog'){
        const b=document.createElement('button'); b.className='pb '+(inp.c||'');
        b.innerHTML=`${inp.d}<small>${inp.n}</small>`;
        b.onclick=()=>sim.set(inp.d,!sim.get(inp.d));
        row.appendChild(b); inp._el=b;
      }else if(inp.k==='sel'){
        const wrap=document.createElement('div'); wrap.style.width='100%';
        const seg=document.createElement('div'); seg.className='seg';
        for(const o of inp.opts){
          const b=document.createElement('button'); b.textContent=o.label;
          b.onclick=()=>{ for(const oo of inp.opts) for(const [k,v] of Object.entries(oo.set)) sim.set(k,false);
                          for(const [k,v] of Object.entries(o.set)) sim.set(k,!!v); };
          seg.appendChild(b); o._el=b;
        }
        wrap.appendChild(seg); row.appendChild(wrap);
      }else if(inp.k==='slider'){
        const wrap=document.createElement('div'); wrap.className='slider'; wrap.style.width='100%';
        const r=document.createElement('input'); r.type='range'; r.min=0; r.max=100; r.step=1;
        r.value=sim.m[inp.mk]||0;
        const s=document.createElement('span');
        r.oninput=()=>{ sim.m[inp.mk]=+r.value; sim.m[inp.mk+'_man']=true; };
        wrap.appendChild(r); wrap.appendChild(s); row.appendChild(wrap);
        inp._r=r; inp._s=s;
      }
    }
    box.appendChild(grp);
  }
}
function paintControls(sim){
  for(const inp of sim.cfg.inputs){
    if(inp.k==='tog'&&inp._el) inp._el.classList.toggle('on',sim.get(inp.d));
    if(inp.k==='mom'&&inp._el) inp._el.classList.toggle('down',sim.get(inp.d));
    if(inp.k==='sel') for(const o of inp.opts){
      const on=Object.entries(o.set).every(([k,v])=>sim.get(k)===!!v);
      o._el.classList.toggle('on',on);
    }
    if(inp.k==='slider'&&inp._r){
      if(document.activeElement!==inp._r) inp._r.value=Math.round(sim.m[inp.mk]||0);
      inp._s.textContent=(inp.fmt?inp.fmt(sim.m[inp.mk]||0):Math.round(sim.m[inp.mk]||0)+'%');
    }
  }
}
function buildLamps(sim){

function paintLamps(sim){

function buildDevs(sim){

      ((v.k==='ton'||v.k==='toff'||v.k==='cnt')?'<div class="bar"><i></i></div>':'');

function paintDevs(sim){
  for(const it of (sim.cfg._dl||[])){
    const d=sim.d(it.k);
    let on=d.on;
    if(d.kind==='toff') on=d.on||d.held;
    if(d.kind==='cnt') on=d.cnt>0;
    it.e.classList.toggle('on',on);
    if(it.bar){
      if(d.kind==='cnt'){ it.bar.style.width=Math.min(100,d.cnt/d.preset*100)+'%';
        it.e.querySelector('.s').textContent=`計數 ${d.cnt}/${d.preset}`; }
      else{ const p=d.kind==='toff' ? (d.held? (1-d.t/d.T)*100 : 0) : d.t/d.T*100;
        it.bar.style.width=Math.max(0,Math.min(100,p))+'%'; }

const G={sim:null,cfg:null,sc:0,step:-1,play:false,timer:0,phase:'idle',view:'all',zoom:1};
function applyZoom(){
  const svg=document.querySelector('#diagram svg'); if(!svg) return;
  const W=(G.cfg&&G.cfg._natW)||+svg.getAttribute('viewBox').split(' ')[2];
  svg.style.width=Math.round(W*G.zoom)+'px';
  svg.style.minWidth='0'; svg.style.height='auto';
  const p=document.getElementById('zpct'); if(p) p.textContent=Math.round(G.zoom*100)+'%';
}
function fitZoom(){
  const bd=document.querySelector('#stage .bd'), svg=document.querySelector('#diagram svg');
  if(!bd||!svg) return;
  const W=(G.cfg&&G.cfg._natW)||+svg.getAttribute('viewBox').split(' ')[2];
  const pw=document.getElementById('power');
  const side=(pw&&pw.offsetParent&&window.innerWidth>900)?pw.offsetWidth:0;
  const avail=bd.clientWidth-side-46;
  /* 依容器寬（而非視窗寬）決定下限：窄容器先求看到全貌，細節用全螢幕放大 */
  const floor = bd.clientWidth < 900 ? 0.1 : 0.35;
  G.zoom=Math.max(floor,Math.min(1,avail/W)); applyZoom();
}

function buildScen(){
  const sel=document.getElementById('scen'); sel.innerHTML='';
  (G.cfg.scenarios||[]).forEach((s,i)=>{
    const o=document.createElement('option'); o.value=i; o.textContent=(i+1)+'. '+s.name; sel.appendChild(o);
  });
  sel.value=G.sc; renderSteps();
}
function renderSteps(){
  const ol=document.getElementById('steplist'); ol.innerHTML='';
  const sc=(G.cfg.scenarios||[])[G.sc]; if(!sc) return;
  sc.steps.forEach((st,i)=>{
    const li=document.createElement('li'); li.innerHTML=st.t;
    li.className = i===G.step?'on':(i<G.step?'done':'');
    li.onclick=()=>{ gotoStep(i); };
    ol.appendChild(li);
  });
  const cur=ol.querySelector('li.on'); if(cur) cur.scrollIntoView({block:'nearest'});
}
function gotoStep(i){
  const sc=G.cfg.scenarios[G.sc]; if(!sc) return;
  if(i<=0){ G.sim.reset(); if(sc.setup) sc.setup(G.sim); G.step=-1; }
  if(i<G.step){ G.sim.reset(); if(sc.setup) sc.setup(G.sim); G.step=-1;
    for(let k=0;k<i;k++){ runStep(sc.steps[k]); settleFor(sc.steps[k].skip||1.6); } }
  else { for(let k=G.step+1;k<i;k++){ runStep(sc.steps[k]); settleFor(sc.steps[k].skip||1.6); } }
  G.step=i; runStep(sc.steps[i]);
  document.getElementById('narr').innerHTML=`<b>步驟 ${i+1}</b> ｜ ${sc.steps[i].t}`;
  G.timer=0; G.phase='wait'; renderSteps();
}
function runStep(st){ if(st.a) st.a(G.sim); }
function settleFor(sec){ let t=0; while(t<sec){ G.sim.tick(0.05); t+=0.05; } }
function nextStep(){
  const sc=G.cfg.scenarios[G.sc]; if(!sc) return;
  if(G.step>=sc.steps.length-1){ G.play=false; syncPlay();
    document.getElementById('narr').innerHTML='<b>情境結束</b> ｜ 可切換其他情境，或用操作盤自行操作。'; return; }
  gotoStep(G.step+1);
}
function prevStep(){ if(G.step>0) gotoStep(G.step-1); else gotoStep(0); }
function syncPlay(){ const b=document.getElementById('bPlay');
  b.textContent=G.play?'❚❚ 暫停':'▶ 自動播放'; b.classList.toggle('play',!G.play); }

const CIRCUITS=[];


/* ===================== 主電路（動力電路）繪圖庫 ===================== */
const PW={
  wire(x1,y1,x2,y2,hot){ return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
      stroke="${hot?C.red:C.wr}" stroke-width="${hot?3.2:2.2}" stroke-linecap="round"/>`; },
  dash(x1,y1,x2,y2){ return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
      stroke="${C.mt2}" stroke-width="1.6" stroke-dasharray="6 4"/>`; },
  dot(x,y){ return `<circle cx="${x}" cy="${y}" r="3.4" fill="${C.railc||C.mt2}"/>`; },
  txt(x,y,t,c,sz,anc){ return `<text x="${x}" y="${y}" fill="${c||C.mu}" font-size="${sz||11}"
      text-anchor="${anc||'start'}" font-family="monospace">${t}</text>`; },
  /* 端子台 */
  tb(x,y,w,n,lab,pins){
    let o=`<rect x="${x}" y="${y}" width="${w}" height="18" rx="2" fill="${C.sf}"
        stroke="${C.ln}" stroke-width="1.8"/>`;
    for(let i=0;i<n;i++){ const px=x+w*(i+0.5)/n;
      o+=`<circle cx="${px}" cy="${y+9}" r="3.4" fill="none" stroke="${C.symc}" stroke-width="1.6"/>`;
      if(pins&&pins[i]) o+=PW.txt(px+5,y+6,pins[i],C.dm,9); }
    o+=PW.txt(x+w+7,y+13,lab,C.mu,10.5); return o;
  },
  /* 無熔線斷路器 NFB（三極） */
  nfb(x,y,xs,on){
    let o='';
    for(const px of xs){
      o+=`<path d="M${px-11} ${y} A11 11 0 0 1 ${px+11} ${y}" fill="none"
           stroke="${on?C.red:C.symc}" stroke-width="2.2"/>`
       + `<circle cx="${px-11}" cy="${y}" r="3" fill="none" stroke="${C.symc}" stroke-width="1.6"/>`
       + `<circle cx="${px+11}" cy="${y}" r="3" fill="none" stroke="${C.symc}" stroke-width="1.6"/>`;
    }
    o+=PW.dash(xs[0],y-11,xs[xs.length-1],y-11);
    o+=PW.txt(xs[xs.length-1]+26,y+4,'NFB',C.mu,11); return o;
  },
  /* 電磁接觸器主接點（可指定極數） */
  mc(x,y,xs,on,lab,labSide){
    let o='';
    for(const px of xs){
      o+=`<line x1="${px-13}" y1="${y-5}" x2="${px+13}" y2="${y-5}"
            stroke="${on?C.red:C.symc}" stroke-width="4.2"/>`
       + `<line x1="${px-13}" y1="${y+5}" x2="${px+13}" y2="${y+5}"
            stroke="${on?C.red:C.symc}" stroke-width="4.2"/>`;
      if(on) o+=`<line x1="${px}" y1="${y-5}" x2="${px}" y2="${y+5}" stroke="${C.red}" stroke-width="4.2"/>`;
    }
    const lx = labSide==='L' ? xs[0]-20 : xs[xs.length-1]+20;
    o+=PW.txt(lx,y+4,lab,on?C.red:C.mu,11,labSide==='L'?'end':'start'); return o;
  },
  /* 積熱電驛 TH-RY（熱動元件） */
  thry(x,y,xs,trip,lab){
    let o='';
    for(const px of xs){
      o+=`<path d="M${px-8} ${y+9} L${px-8} ${y-4} L${px+3} ${y-4}" fill="none"
           stroke="${trip?C.amb:C.symc}" stroke-width="2.2"/>`;
    }
    o+=PW.txt(xs[xs.length-1]+16,y+4,lab||'TH-RY',trip?C.amb:C.mu,11); return o;
  },
  /* 電動機 */
  motor(x,y,run,lab,hp){
    return `<circle cx="${x}" cy="${y}" r="17" fill="${run?C.hotbg:C.sf}"
        stroke="${run?C.red:C.ln}" stroke-width="2.2"/>`
      + PW.txt(x,y+5,lab||'M',run?C.red:C.mu,12,'middle')
      + (hp?PW.txt(x,y+34,hp,C.dm,10,'middle'):'');
  },
  /* 接地 */
  gnd(x,y){ return `<line x1="${x-11}" y1="${y}" x2="${x+11}" y2="${y}" stroke="${C.okfg}" stroke-width="2.2"/>`
    + `<line x1="${x-7}" y1="${y+4}" x2="${x+7}" y2="${y+4}" stroke="${C.okfg}" stroke-width="2"/>`
    + `<line x1="${x-3}" y1="${y+8}" x2="${x+3}" y2="${y+8}" stroke="${C.okfg}" stroke-width="2"/>`; },
  /* 熔絲 D-F */
  df(x,y,lab){ return `<rect x="${x-16}" y="${y-7}" width="32" height="14" fill="${C.sf}"
      stroke="${C.symc}" stroke-width="1.6"/>`
    + `<line x1="${x-16}" y1="${y+7}" x2="${x+16}" y2="${y-7}" stroke="${C.symc}" stroke-width="1.6"/>`
    + PW.txt(x,y-12,lab||'D-F',C.dm,9.5,'middle'); },
  /* 虛線框（電磁開關 MS / 盤內元件） */
  box(x,y,w,h,lab){ return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none"
      stroke="${C.mt2}" stroke-width="1.5" stroke-dasharray="7 5"/>`
    + PW.txt(x+w+6,y+h/2,lab,C.mu,10.5); },
  /* 三相母線（R S T 縱走） */
  bus3(xs,y1,y2,hot){ return xs.map((x,i)=>PW.wire(x,y1,x,y2,hot)).join(''); },
  head(xs,y,labs){ return PW.tb(xs[0]-22,y-9,(xs[2]-xs[0])+44,3,'TB1',labs)
    + PW.txt(xs[0]-24,y-22,'3φ 3W 220V',C.mu,11); }
};

/* 三相電源頭（TB1 → NFB），回傳 SVG 與下一個 y */
function pwrHead(xs,y,live){
  return PW.head(xs,y,['R','S','T'])
    + PW.bus3(xs,y+9,y+44,live)
    + PW.nfb(0,y+44,xs,live)
    + PW.bus3(xs,y+55,y+88,live);
}

/* ---- 第1、2題：正反轉兼 Y-Δ 主電路（依官方試題圖 p.1 重繪） ---- */
function powerYD(S){
  const xs=[62,104,146];                       // R S T 主幹
  const rx=[214,256,298];                      // MCR 換相支路
  const F=S.get('MCF'), R=S.get('MCR'), Y=S.get('MCS'), D=S.get('MCD');
  const T=S.get('THR'), live=(F||R)&&!T, run=live&&(Y||D);
  let o=pwrHead(xs,30,true);                   // TB1 → NFB
  // 換相支路：R→W、T→U（NFB 下方引出）
  o+=PW.wire(xs[0],124,rx[2],124,true)+PW.wire(rx[2],124,rx[2],150,true)
    +PW.wire(xs[1],131,rx[1],131,true)+PW.wire(rx[1],131,rx[1],150,true)
    +PW.wire(xs[2],138,rx[0],138,true)+PW.wire(rx[0],138,rx[0],150,true)
    +PW.dot(xs[0],124)+PW.dot(xs[1],131)+PW.dot(xs[2],138)
    +PW.bus3(xs,120,150,true);
  o+=PW.mc(0,158,xs,F,'MCF','L')+PW.mc(0,158,rx,R,'MCR','R');
  // MCR 輸出併回主幹
  o+=PW.bus3(rx,166,192,R)
    +PW.wire(rx[0],192,xs[0],192,R)+PW.wire(rx[1],199,xs[1],199,R)+PW.wire(rx[2],206,xs[2],206,R)
    +PW.wire(rx[0],192,rx[0],192,R)+PW.wire(rx[1],192,rx[1],199,R)+PW.wire(rx[2],192,rx[2],206,R);
  o+=PW.bus3(xs,166,222,F||R);
  o+=PW.thry(0,230,xs,T,'TH-RY')+PW.bus3(xs,240,266,live);
  o+=PW.tb(xs[0]-24,266,(xs[2]-xs[0])+48,3,'TB2',['U','V','W']);
  // 馬達（六線 U V W / X Y Z）
  o+=PW.motor(104,336,run,'M','15HP')+PW.gnd(30,330)+PW.wire(30,284,30,330,false);
  for(let i=0;i<3;i++) o+=PW.dash(xs[i],284,98+i*6,320);
  o+=PW.tb(xs[0]-24,382,(xs[2]-xs[0])+48,3,'TB2',['X','Y','Z']);
  for(let i=0;i<3;i++) o+=PW.dash(98+i*6,353,xs[i],382);
  // MCD：U-Z、V-X、W-Y（Δ 接線）
  const dx=[214,256,298];
  o+=PW.wire(xs[0],290,dx[2],290,live)+PW.wire(dx[2],290,dx[2],328,live)
    +PW.wire(xs[1],297,dx[1],297,live)+PW.wire(dx[1],297,dx[1],328,live)
    +PW.wire(xs[2],304,dx[0],304,live)+PW.wire(dx[0],304,dx[0],328,live)
    +PW.wire(xs[0],284,xs[0],290,live)+PW.wire(xs[1],284,xs[1],297,live)
    +PW.wire(xs[2],284,xs[2],304,live);

/* ---------- 盤內模組（虛線框 / 端子台 / 電極棒） ---------- */
const MOD={
  box(x,y,w,h,lab,dashdot){
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${C.mt2}"
      stroke-width="1.6" stroke-dasharray="${dashdot?'10 4 2 4':'8 5'}"/>`
      + (lab ? `<text x="${x+7}" y="${y+15}" fill="${C.mu}" font-size="11">${lab}</text>` : '');
  },
  pins(x,y,w,names,up){
    let o='';
    names.forEach((n,i)=>{ const px=x+w*(i+0.5)/names.length;
      o+=`<circle cx="${px}" cy="${y}" r="3.2" fill="none" stroke="${C.symc}" stroke-width="1.5"/>`
       + `<text x="${px}" y="${y+(up?-8:14)}" fill="${C.dm}" font-size="9.5"
            text-anchor="middle" font-family="monospace">${n}</text>`; });
    return o;
  },
  tb(x,y,w,n,lab){
    let o=`<rect x="${x}" y="${y}" width="${w}" height="16" rx="2" fill="${C.sf}"
      stroke="${C.ln}" stroke-width="1.6"/>`;
    for(let i=0;i<n;i++){ const px=x+w*(i+0.5)/n;
      o+=`<circle cx="${px}" cy="${y+8}" r="3" fill="none" stroke="${C.symc}" stroke-width="1.4"/>`; }
    return o+`<text x="${x+w+6}" y="${y+12}" fill="${C.mu}" font-size="10">${lab}</text>`;
  },
  /* 電極棒（基座 + 三支電極） */
  rods(x,y,labs,onIdx){
    let o=`<ellipse cx="${x}" cy="${y}" rx="30" ry="9" fill="${C.sf2}" stroke="${C.ln}" stroke-width="1.5"/>`
      + `<text x="${x}" y="${y+4}" fill="${C.mu}" font-size="9.5" text-anchor="middle">基座</text>`;
    labs.forEach((L,i)=>{ const px=x-18+i*18, len=26+i*16;
      const on = onIdx!==undefined && i<=onIdx;
      o+=`<line x1="${px}" y1="${y+9}" x2="${px}" y2="${y+9+len}" stroke="${on?C.red:C.symc}" stroke-width="2.2"/>`
       + `<text x="${px}" y="${y+22+len}" fill="${on?C.red:C.dm}" font-size="9.5"
            text-anchor="middle" font-family="monospace">${L}</text>`; });
    return o;
  },
  wire(x1,y1,x2,y2,hot){ return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
    stroke="${hot?C.red:C.wr}" stroke-width="2" fill="none"/>`; },
  dash(x1,y1,x2,y2){ return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"
    stroke="${C.mt2}" stroke-width="1.4" stroke-dasharray="5 4"/>`; },
  txt(x,y,t,c,sz,a){ return `<text x="${x}" y="${y}" fill="${c||C.mu}" font-size="${sz||10}"
    text-anchor="${a||'start'}">${t}</text>`; }
};

/* ---------- 水位槽繪圖 ---------- */
function tankSVG({x,y,w,h,lv,marks,label,col}){
  const fh=h*lv/100;
  let m='';
  for(const k of marks){
    const my=y+h-h*k.at/100;
    m+=`<line x1="${x-7}" y1="${my}" x2="${x+w+2}" y2="${my}" stroke="${k.c}" stroke-width="1.4"
         stroke-dasharray="4 3"/>
        <text x="${x+w+6}" y="${my+3.5}" fill="${k.c}" font-size="9">${k.n}</text>
        <line x1="${x+k.ex}" y1="${y+3}" x2="${x+k.ex}" y2="${my}" stroke="${k.c}" stroke-width="2"/>`;
  }
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${C.sf}" stroke="${C.ln}" stroke-width="2" rx="3"/>
    <rect x="${x+1}" y="${y+h-fh}" width="${w-2}" height="${fh}" fill="${col||C.water}" opacity=".78"/>
    <line x1="${x+1}" y1="${y+h-fh}" x2="${x+w-1}" y2="${y+h-fh}" stroke="${C.wtop}" stroke-width="1.6"/>
    ${m}<text x="${x+w/2}" y="${y-5}" fill="${C.mu}" font-size="10" text-anchor="middle">${label}</text>`;
}
function pumpSVG(x,y,on,name){
  return `<circle cx="${x}" cy="${y}" r="13" fill="${on?C.hotbg:C.sf}"
      stroke="${on?C.red:C.ln}" stroke-width="2"/>
    <text x="${x}" y="${y+4}" fill="${on?C.hotfg:C.dm}" font-size="10"
      text-anchor="middle" font-family="monospace">${name}</text>
    ${on?`<circle cx="${x}" cy="${y}" r="17" fill="none" stroke="${C.red}" stroke-width="1.4" opacity=".5"/>`:''}`;
}

function q8paint(S){
  const svg=document.getElementById('diagram'); if(!svg) return;
  const dim=(cls,on)=>{ const g=svg.querySelector('.'+cls);
    if(g){ g.style.opacity=on?1:0.09; g.style.transition='opacity .25s'; } };
  dim('g1',S.get('LY1')); dim('g2',S.get('LY2')); dim('g3',S.get('LY3')); dim('g4',S.get('LY4'));
  const vi=S.get('VS1')?0:S.get('VS2')?1:S.get('VS3')?2:3;
  const ai=S.get('AS1')?0:S.get('AS2')?1:S.get('AS3')?2:3;
  const vp=svg.querySelector('#vsPtr'), ap=svg.querySelector('#asPtr');
  if(vp) vp.setAttribute('transform',`rotate(${Q8VS[vi].a} 470 446)`);
  if(ap) ap.setAttribute('transform',`rotate(${Q8AS[ai].a} 240 324)`);
  const vl=svg.querySelector('#vsLbl'), al=svg.querySelector('#asLbl');
  if(vl) vl.textContent=Q8VS[vi].n; if(al) al.textContent=Q8AS[ai].n;
  const V=[220,220,220,0][vi], A=[38.5,38.5,38.5,0][ai];
  const T=(id,v)=>{const e=svg.querySelector('#'+id); if(e) e.textContent=v;};
  T('m_v',V.toFixed(0)); T('m_a',A.toFixed(1));
  T('m_pf','0.86 lag'); T('m_wh',(S.m.kwh||0).toFixed(1)); T('m_vh',(S.m.kvarh||0).toFixed(1));
}
/*__CIRCUITS__*/

function loadCircuit(i){
  G.cfg=CIRCUITS[i]; G.sim=new Sim(G.cfg); G.sc=0; G.step=-1; G.play=false;
  document.getElementById('ctitle').textContent=G.cfg.title;
  document.getElementById('cScene').style.display = G.cfg.scene? '':'none';
  if(G.cfg.custom){ G.cfg.custom(); }
  else { buildLadder(G.sim); }
  buildControls(G.sim); buildLamps(G.sim); buildDevs(G.sim); buildScen(); syncPlay();
  const hasP=!!G.cfg.power;
  document.getElementById('power').style.display=(hasP&&G.view!=='ctl')?'':'none';
  document.getElementById('diagram').style.display=(G.view==='pwr'&&hasP)?'none':'';
  document.getElementById('vsel').style.display=hasP?'':'none';
  [...document.querySelectorAll('#vsel button')].forEach(b=>b.classList.toggle('on',b.dataset.v===G.view));
  document.getElementById('cLamps').style.display=(G.cfg.lampList||[]).length?'':'none';
  document.getElementById('cDevs').style.display=(G.cfg._dl||[]).length?'':'none';
  document.getElementById('narr').innerHTML = G.cfg.desc || '選擇情境開始，或直接操作。';
  [...document.querySelectorAll('#tabs button')].forEach((b,k)=>b.classList.toggle('on',k===i));
  if(typeof FS!=='undefined'&&FS.on){ fsFit(); requestAnimationFrame(fsFit); }
  else if(!G.cfg.custom){ if(window.innerWidth<=760) fitZoom(); else { G.zoom=1; applyZoom(); } }
}
function buildTabs(){
  const n=document.getElementById('tabs'); n.innerHTML='';
  CIRCUITS.forEach((c,i)=>{ const b=document.createElement('button');
    b.textContent=c.tab; b.onclick=()=>loadCircuit(i); n.appendChild(b); });
}
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(G.sim){
    G.sim.tick(dt);
    if(!G.cfg.custom) paintLadder(G.sim);
    paintControls(G.sim); paintLamps(G.sim); paintDevs(G.sim);
    if(G.cfg.scene) document.getElementById('scene').innerHTML=G.cfg.scene(G.sim);
    if(G.cfg.power && G.view!=='ctl'){
      const k=window.innerWidth<=760 ? (G.view==='pwr'?1.2:0.9) : (G.view==='pwr'?2.0:1.5);
      document.getElementById('power').innerHTML='<p class="cap">主電路（動力電路）</p>'+
        G.cfg.power(G.sim).replace(/viewBox="0 0 (\d+) (\d+)"/,
          (m,w,h)=>`viewBox="0 0 ${w} ${h}" width="${Math.round(w*k)}" height="${Math.round(h*k)}"`);
    }
    if(G.cfg.paint) G.cfg.paint(G.sim);
    if(G.play){
      G.timer+=dt;
      const sc=G.cfg.scenarios[G.sc], st=sc&&sc.steps[G.step];
      const need = st? (st.hold||1.8) : 1.0;
      const ready = st&&st.until ? st.until(G.sim) : true;
      if(G.timer>need && ready) nextStep();
      if(G.timer>18) nextStep();
    }
    document.getElementById('gstat').textContent =
      G.cfg.scenarios&&G.cfg.scenarios[G.sc] ? `${G.step+1} / ${G.cfg.scenarios[G.sc].steps.length} 步` : '';
  }
  requestAnimationFrame(loop);
}
document.getElementById('scen').onchange=e=>{ G.sc=+e.target.value; G.step=-1; G.sim.reset();
  const sc=G.cfg.scenarios[G.sc]; if(sc.setup) sc.setup(G.sim); renderSteps();
  document.getElementById('narr').innerHTML=sc.intro||'按「下一步」開始逐步觀察。'; };
/* ---------- 全螢幕檢視（手機可整張圖瀏覽） ---------- */
const FS={on:false,x:0,y:0,z:1,px:0,py:0,pd:0};
function fsFit(){
  const bd=document.querySelector('#stage .bd'),svg=document.querySelector('#diagram svg');
  if(!bd||!svg) return;
  const vb=svg.getAttribute('viewBox').split(' ');
  const W=+vb[2],H=+vb[3];
  const z=Math.min(bd.clientWidth/(W+16),bd.clientHeight/(H+16));
  FS.z=Math.max(0.08,z); FS.x=(bd.clientWidth-W*FS.z)/2; FS.y=10;
  fsApply();
}
function fsApply(){
  const d=document.getElementById('diagram');
  d.style.transform=`translate(${FS.x}px,${FS.y}px) scale(${FS.z})`;
  const p=document.getElementById('zpct'); if(p) p.textContent=Math.round(FS.z*100)+'%';
}
function fsHint(t){
  let h=document.querySelector('.fshint');
  if(!h){ h=document.createElement('div'); h.className='fshint'; document.body.appendChild(h); }
  h.textContent=t; h.classList.add('show');
  clearTimeout(h._t); h._t=setTimeout(()=>h.classList.remove('show'),2600);
}
function fsEnter(){
  const st=document.getElementById('stage');
  FS.on=true; st.classList.add('fs'); document.body.classList.add('fslock');
  document.getElementById('bFs').textContent='✕ 離開全螢幕';
  const svg=document.querySelector('#diagram svg');
  if(svg){ svg.style.width=''; svg.style.minWidth='0'; }
  requestAnimationFrame(()=>{ fsFit();
    const portrait = window.innerHeight > window.innerWidth && window.innerWidth <= 820;
    fsHint(portrait ? '手機轉橫向可看得更清楚 · 雙指縮放 · 點兩下還原'
                    : '雙指縮放 · 單指拖曳 · 點兩下還原'); });
  if(st.requestFullscreen) st.requestFullscreen().catch(()=>{});
}
function fsExit(){
  const st=document.getElementById('stage');
  FS.on=false; st.classList.remove('fs'); document.body.classList.remove('fslock');
  document.getElementById('bFs').textContent='⛶ 全螢幕';
  document.getElementById('diagram').style.transform='';
  if(document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  if(window.innerWidth<=760) fitZoom(); else { G.zoom=1; applyZoom(); }
}
(function(){
  const bd=document.querySelector('#stage .bd');
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  const mid=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
  bd.addEventListener('touchstart',e=>{
    if(!FS.on) return;
    if(e.touches.length===2){ FS.pd=dist(e.touches); const m=mid(e.touches);
      FS.px=m.x; FS.py=m.y; }
    else if(e.touches.length===1){ FS.px=e.touches[0].clientX; FS.py=e.touches[0].clientY; }
  },{passive:true});
  bd.addEventListener('touchmove',e=>{
    if(!FS.on) return;
    e.preventDefault();
    const r=bd.getBoundingClientRect();
    if(e.touches.length===2){
      const d=dist(e.touches),m=mid(e.touches);
      if(FS.pd>0){
        const k=d/FS.pd, nz=Math.max(0.08,Math.min(6,FS.z*k));
        const cx=m.x-r.left,cy=m.y-r.top;
        FS.x=cx-(cx-FS.x)*(nz/FS.z); FS.y=cy-(cy-FS.y)*(nz/FS.z); FS.z=nz;
      }
      FS.pd=d; FS.px=m.x; FS.py=m.y; fsApply();
    } else if(e.touches.length===1){
      const t=e.touches[0];
      FS.x+=t.clientX-FS.px; FS.y+=t.clientY-FS.py;
      FS.px=t.clientX; FS.py=t.clientY; fsApply();
    }
  },{passive:false});
  bd.addEventListener('touchend',e=>{ if(e.touches.length<2) FS.pd=0; },{passive:true});
  bd.addEventListener('dblclick',()=>{ if(FS.on) fsFit(); });
  bd.addEventListener('wheel',e=>{
    if(!FS.on) return; e.preventDefault();
    const r=bd.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top;
    const nz=Math.max(0.08,Math.min(6,FS.z*(e.deltaY<0?1.12:0.89)));
    FS.x=cx-(cx-FS.x)*(nz/FS.z); FS.y=cy-(cy-FS.y)*(nz/FS.z); FS.z=nz; fsApply();
  },{passive:false});
  window.addEventListener('keydown',e=>{ if(e.key==='Escape'&&FS.on) fsExit(); });
  window.addEventListener('resize',()=>{ if(FS.on) setTimeout(fsFit,120); });
  document.addEventListener('fullscreenchange',()=>{
    if(!document.fullscreenElement&&FS.on) fsExit(); });
})();

[...document.querySelectorAll('#zoom button')].forEach(b=>b.onclick=()=>{
  const z=b.dataset.z;
  if(z==='fit'){ FS.on?fsFit():fitZoom(); }
  else if(z==='fs'){ FS.on?fsExit():fsEnter(); }
  else if(FS.on){ FS.z=Math.max(0.08,Math.min(6,FS.z*(z==='+'?1.25:0.8))); fsApply(); }
  else { G.zoom=Math.max(0.25,Math.min(3,G.zoom*(z==='+'?1.25:0.8))); applyZoom(); }
});
window.addEventListener('resize',()=>{ if(window.innerWidth<=760) fitZoom(); });
[...document.querySelectorAll('#vsel button')].forEach(b=>b.onclick=()=>{
  G.view=b.dataset.v; loadCircuit(CIRCUITS.indexOf(G.cfg)); });
document.getElementById('bNext').onclick=nextStep;
document.getElementById('bPrev').onclick=prevStep;
document.getElementById('bReset').onclick=()=>{ G.sim.reset(); G.step=-1; G.play=false; syncPlay();
  renderSteps(); document.getElementById('narr').innerHTML='電路已重置為初始狀態。'; };
document.getElementById('bPlay').onclick=()=>{ G.play=!G.play; G.timer=99;
  if(G.play&&G.step<0) gotoStep(0); syncPlay(); };


document.getElementById('theme').onclick=()=>
  setTheme(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light');
(function(){ let t=null;
  try{ t=localStorage.getItem('s2theme'); }catch(e){}
  if(!t) t = window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches ? 'light':'dark';
  setTheme(t);
})();
buildTabs(); loadCircuit(0); requestAnimationFrame(loop);

/* ---------- PWA ---------- */
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
